apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: sre
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order
          image: sre/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: sre-config
            - secretRef:
                name: sre-secrets
          env:
            - name: INVENTORY_URL
              value: http://inventory-service
            - name: PAYMENT_URL
              value: http://payment-service
            - name: DATABASE_URL
              value: postgresql://sre:$(POSTGRES_PASSWORD)@postgres:5432/sre
          readinessProbe:
            httpGet:
              path: /health
              port: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigator
  namespace: sre
spec:
  replicas: 2
  selector:
    matchLabels:
      app: investigator
  template:
    metadata:
      labels:
        app: investigator
    spec:
      containers:
        - name: investigator
          image: sre/investigator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: sre-config
            - secretRef:
                name: sre-secrets
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
            - name: LOKI_URL
              value: http://loki:3100
            - name: TEMPO_URL
              value: http://tempo:3200
          readinessProbe:
            httpGet:
              path: /health
              port: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
