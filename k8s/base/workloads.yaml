apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: sre
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory
          image: sre/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: sre-config
            - secretRef:
                name: sre-secrets
          env:
            - name: DATABASE_URL
              value: postgresql://sre:$(POSTGRES_PASSWORD)@postgres:5432/sre
          readinessProbe:
            httpGet:
              path: /health
              port: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
