global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:80']
  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:80']
  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:80']
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464']  # metrics endpoint from collector config
  - job_name: 'orion-service'
    static_configs:
      - targets: ['orion-service:8000']
