services:
  order-service:
    build:
      context: ./services
      dockerfile: order_service/Dockerfile
    container_name: order-service
    ports:
      - "127.0.0.1:8000:80"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - INVENTORY_URL=http://inventory-service
      - PAYMENT_URL=http://payment-service
      - DATABASE_URL=postgresql://sre:${POSTGRES_PASSWORD:?Run scripts/start_local.py first}@postgres:5432/sre
      - AUTH_ENABLED=true
      - OIDC_ISSUER=http://localhost:8081/realms/sre-local
      - OIDC_AUDIENCE=sre-api
      - OIDC_JWKS_URL=http://keycloak:8080/realms/sre-local/protocol/openid-connect/certs
      - OIDC_ALGORITHM=RS256
    restart: unless-stopped
    depends_on:
      - inventory-service
      - payment-service
      - otel-collector
      - postgres
      - keycloak
  inventory-service:
    build:
      context: ./services
      dockerfile: inventory_service/Dockerfile
    container_name: inventory-service
    ports:
      - "127.0.0.1:8001:80"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - DATABASE_URL=postgresql://sre:${POSTGRES_PASSWORD:?Run scripts/start_local.py first}@postgres:5432/sre
      - AUTH_ENABLED=true
      - OIDC_ISSUER=http://localhost:8081/realms/sre-local
      - OIDC_AUDIENCE=sre-api
      - OIDC_JWKS_URL=http://keycloak:8080/realms/sre-local/protocol/openid-connect/certs
      - OIDC_ALGORITHM=RS256
    restart: unless-stopped
    depends_on:
      - otel-collector
      - postgres
      - keycloak
  payment-service:
    build:
      context: ./services
      dockerfile: payment_service/Dockerfile
    container_name: payment-service
    ports:
      - "127.0.0.1:8002:80"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PAYMENT_PROVIDER_MODE=demo
      - PAYMENT_CURRENCY=USD
      - AUTH_ENABLED=true
      - OIDC_ISSUER=http://localhost:8081/realms/sre-local
      - OIDC_AUDIENCE=sre-api
      - OIDC_JWKS_URL=http://keycloak:8080/realms/sre-local/protocol/openid-connect/certs
      - OIDC_ALGORITHM=RS256
    restart: unless-stopped
    depends_on:
      - otel-collector
      - keycloak
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command: ["--config=/etc/collector/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/collector/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/start_local.py first}
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: sre-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-localadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
  investigator:
    build: ./investigator
    container_name: investigator
    ports:
      - "127.0.0.1:9000:80"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - TEMPO_URL=http://tempo:3200
      - AUTH_ENABLED=true
      - OIDC_ISSUER=http://localhost:8081/realms/sre-local
      - OIDC_AUDIENCE=sre-api
      - OIDC_JWKS_URL=http://keycloak:8080/realms/sre-local/protocol/openid-connect/certs
      - OIDC_ALGORITHM=RS256
    depends_on:
      - otel-collector
      - prometheus
      - loki
      - tempo
      - keycloak
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sre-postgres
    environment:
      POSTGRES_DB: sre
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start_local.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre -d sre"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  postgres-data:
  keycloak-data:
