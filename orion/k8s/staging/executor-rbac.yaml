apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-executor
  namespace: sre-staging
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orion-executor
  namespace: sre-staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orion-executor
  namespace: sre-staging
subjects:
  - kind: ServiceAccount
    name: orion-executor
    namespace: sre-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orion-executor
