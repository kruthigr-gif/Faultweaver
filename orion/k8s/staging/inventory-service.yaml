apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: sre-staging
  labels:
    app: inventory-service
    orion.sre/managed: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory
          image: sentinelsre/inventory-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://host.docker.internal:4317
            - name: AUTH_ENABLED
              value: "false"
            - name: LATENCY_MS
              value: "0"
            - name: FORCE_ERROR
              value: ""
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: sre-staging
  labels:
    orion.sre/managed: "true"
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 80
      targetPort: http
